model = "Qwen/Qwen3-VL-4B-Instruct"
max_steps = 300
batch_size = 128
rollouts_per_example = 8

[sampling]
max_tokens = 4096

[[env]]
id = "13point5/chart-extraction"
args = { output_mode = "json", dataset_repo_id = "13point5/chart-extraction-dense-noisy-v1", chart_type_filter = "line" }

[wandb]
entity = "13point5-labs"
project = "chart-extraction"
name = "qwen3-vl-4b-json-dense-line-v1"

[val]
interval = 25
num_examples = 100
rollouts_per_example = 1
