model = "Qwen/Qwen3-VL-4B-Instruct"
max_steps = 300
batch_size = 512
rollouts_per_example = 8
learning_rate = 1e-4
oversampling_factor = 2.0
env_file = ["../secrets.env"]

[infrastructure]
compute_size = "L"

[sampling]
max_tokens = 20000

[[env]]
id = "13point5/chart-extraction"
args = { schema_version = "v2" }

[wandb]
project = "chart-extraction"
name = "qwen3-vl-4b-batch-512-oks-lr-1e4-schema-v2"
entity = "13point5-labs"

# [eval]
# interval = 100
# num_examples = 1000
# rollouts_per_example = 1
# eval_base_model = true

# [[eval.env]]
# id = "13point5/chart-extraction"
# args = { schema_version = "v2" }

[val]
num_examples = 100
rollouts_per_example = 1
interval = 50

# Optional: buffer configuration for difficulty filtering
[buffer]
easy_threshold = 5.5
hard_threshold = 3.0
easy_fraction = 1.0
hard_fraction = 0.0
online_difficulty_filtering = true
seed = 42
