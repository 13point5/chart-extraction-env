model = "Qwen/Qwen3-VL-4B-Instruct"
max_steps = 300
batch_size = 512
rollouts_per_example = 8
learning_rate = 1e-4
env_file = ["../secrets.env"]

[infrastructure]
compute_size = "L"

[sampling]
max_tokens = 20000

[[env]]
id = "13point5/chart-extraction"
args = { schema_version = "v2", series_point_value_oks_k = 0.05, series_point_value_oks_threshold = 0.35, disabled_rewards = ["series_point_count_ratio"] }

[wandb]
project = "chart-extraction"
name = "qwen3-vl-4b-batch-512-oks-lr-1e4-schema-v2"
entity = "13point5-labs"

