[project]
name = "chart-extraction"
description = "Environment for extracting structured data from line chart images"
tags = ["single-turn", "multimodal", "vision", "eval"]
version = "0.1.4"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.12.5",
    "verifiers>=0.1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["chart_extraction.py", "dataset_transform.py", "schemas/*.py", "prompts.py", "rubric/*.py", "rubric/rewards/*.py", "pyproject.toml"] 

[tool.verifiers.eval]
num_examples = 5
rollouts_per_example = 3
